<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fictional vendor portal</title><style>body{max-width:900px;margin:32px auto;padding:20px;font:16px/1.5 system-ui}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:7px}input:not([type=checkbox]),select{display:block;width:95%}pre{white-space:pre-wrap;background:#f2f3f4;padding:15px}#status{font-weight:bold}button{margin:12px 8px 12px 0}</style><h1>Vendor address drafts</h1><p>Fictional local portal for the assignment. Original vendor records stay unchanged.</p><label>Vendor<select id="vendor"><option value="">Choose a vendor</option></select></label><h2>Original address</h2><pre id="original">Choose a vendor.</pre><form id="form"><label>Request ID<input id="request" required></label><label>Address line<input id="line1" required></label><label>City<input id="city" required></label><label>Postal code<input id="postal_code" required></label><label>Country<input id="country" required></label><label><input type="checkbox" id="fail"> Simulate failure on next save</label><button>Save draft</button></form><p id="status" role="status"></p><h2>Saved drafts</h2><pre id="drafts">[]</pre><button id="reset">Reset fictional drafts</button><script>
const vendors=[{"vendor_id": "V1", "name": "Cedar Office", "address": {"line1": "1 Example Road", "city": "Sampleton", "postal_code": "00100", "country": "Exampleland"}}, {"vendor_id": "V2", "name": "Northstar Supplies East", "address": {"line1": "2 Example Road", "city": "Sampleton", "postal_code": "00200", "country": "Exampleland"}}, {"vendor_id": "V3", "name": "Northstar Supplies West", "address": {"line1": "3 Example Road", "city": "Sampleton", "postal_code": "00300", "country": "Exampleland"}}, {"vendor_id": "V4", "name": "Maple Parts", "address": {"line1": "4 Example Road", "city": "Sampleton", "postal_code": "00400", "country": "Exampleland"}}, {"vendor_id": "V5", "name": "Juniper Tools", "address": {"line1": "5 Example Road", "city": "Sampleton", "postal_code": "00500", "country": "Exampleland"}}, {"vendor_id": "V6", "name": "Birch Goods", "address": {"line1": "6 Example Road", "city": "Sampleton", "postal_code": "00600", "country": "Exampleland"}}];
const fields=['line1','city','postal_code','country'];
const byId=id=>document.getElementById(id);
let drafts=JSON.parse(localStorage.getItem('junior-vendor-drafts-v1')||'[]');
function show(){byId('drafts').textContent=JSON.stringify(drafts,null,2)}
for(const v of vendors){const o=document.createElement('option');o.value=v.vendor_id;o.textContent=v.vendor_id+' — '+v.name;byId('vendor').append(o)}
byId('vendor').onchange=()=>{const v=vendors.find(v=>v.vendor_id===byId('vendor').value);byId('original').textContent=v?JSON.stringify(v,null,2):'Choose a vendor.';for(const f of fields)byId(f).value=v?v.address[f]:''};
byId('form').onsubmit=e=>{e.preventDefault();const v=vendors.find(v=>v.vendor_id===byId('vendor').value);if(!v){byId('status').textContent='No vendor selected; nothing saved.';return}if(byId('fail').checked){byId('fail').checked=false;byId('status').textContent='Simulated save failure. Nothing saved.';return}const request_id=byId('request').value.trim();const address=Object.fromEntries(fields.map(f=>[f,byId(f).value.trim()]));if(!request_id||fields.some(f=>!address[f])){byId('status').textContent='Request ID and all address fields are required.';return}const existing=drafts.find(d=>d.request_id===request_id);if(existing){byId('status').textContent='A draft for this request already exists; inspect it before changing anything.';return}drafts.push({request_id,vendor_id:v.vendor_id,address});localStorage.setItem('junior-vendor-drafts-v1',JSON.stringify(drafts));show();byId('status').textContent='Draft saved. Inspect Saved drafts to verify.'};
byId('reset').onclick=()=>{drafts=[];localStorage.removeItem('junior-vendor-drafts-v1');show();byId('status').textContent='Fictional drafts reset.'};show();
</script></html>
